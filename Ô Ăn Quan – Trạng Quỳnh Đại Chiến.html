<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ô Ăn Quan – Trạng Quỳnh Đại Chiến</title>
  <style>
    :root {
      --g: #f5c04a;
      --r: #e8472b;
      --t: #2dd4bf;
      --bg: #120d0c;
      --tx: #fff3dc;
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: inherit;
      margin: 0;
      user-select: none
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--tx);
      font: 15px "Segoe UI", Roboto, system-ui, sans-serif;
      overflow: hidden
    }

    .scr {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #120d0c center/cover;
      padding-top: env(safe-area-inset-top, 0px)
    }

    .scr.on {
      display: flex
    }

    button {
      font: inherit;
      cursor: pointer;
      color: #3a1608;
      background: linear-gradient(#ffd77a, #e0982b);
      border: 2px solid #7a3b0c;
      border-radius: 10px;
      padding: .55em 1.1em;
      font-weight: 700;
      box-shadow: 0 3px 0 #7a3b0c
    }

    button:hover {
      filter: brightness(1.12)
    }

    button:active {
      transform: translateY(2px);
      box-shadow: none
    }

    button.d {
      background: linear-gradient(#5a2b25, #3a1612);
      color: var(--g)
    }

    h1,
    h2 {
      font-family: Georgia, serif;
      color: var(--g);
      text-shadow: 0 0 14px var(--r), 0 2px 0 #000;
      text-align: center
    }

    h1 {
      font-size: clamp(20px, 4.2vh, 40px)
    }

    input {
      font: inherit;
      padding: .5em;
      border-radius: 8px;
      border: 2px solid var(--g);
      background: #fff3dc;
      color: #2a1405;
      text-align: center;
      user-select: text
    }

      background-size: 100% 100%;
      padding: 9vh 12vw 8vh;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 1vh
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1vw
    }

    #ctl {
      display: flex;
      gap: .6vw
    }

    #ctl button {
      padding: .4em .8em
    }

    .chip {
      display: flex;
      align-items: center;
      gap: .7vw;
      padding: .5vh .9vw;
      border: 2px solid #7a3b0c;
      border-radius: 14px;
      background: #000b;
      min-width: 0
    }

    .chip.me {
      border-color: var(--g);
      box-shadow: 0 0 18px var(--g)
    }

    .chip img {
      width: 6.5vh;
      height: 6.5vh;
      border-radius: 50%;
      border: 2px solid var(--g);
      object-fit: cover
    }

    .chip b {
      display: block;
      color: var(--g)
    }

    .chip small {
      opacity: .85
    }

    #mid {
      text-align: center;
      font-weight: 700;
      min-height: 2.6em;
      font-size: clamp(13px, 2.1vh, 18px);
      text-shadow: 0 1px 3px #000;
      display: flex;
      align-items: center;
      justify-content: center
    }

    #bw {
      flex: 1;
      min-height: 0;
      display: flex
    }

    #board {
      flex: 1;
      display: grid;
      grid-template-columns: 1.3fr repeat(5, 1fr) 1.3fr;
      grid-template-rows: 1fr 1fr;
      gap: 1.2vh;
      padding: 1.4vh;
      border-radius: 2vh;
      border: 3px solid #3b1b08;
      background: repeating-linear-gradient(92deg, #0000 0 9px, #0002 9px 10px), linear-gradient(#a0612b, #7a4318);
      box-shadow: 0 10px 30px #000c, inset 0 0 25px #000a
    }

    .cell {
      position: relative;
      border-radius: 14%;
      background: radial-gradient(#3b1c0a, #5b2f12 85%);
      box-shadow: inset 0 4px 14px #000d;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: 2px;
      padding: 7%;
      cursor: pointer;
      transition: .15s
    }

    .cell:hover {
      filter: brightness(1.25)
    }

    .cell.qc {
      border-radius: 50%/38%;
      background: repeating-radial-gradient(#3b1c0a 0 6px, #52280f 6px 8px)
    }

    .cell.ok {
      outline: 3px dashed var(--t)
    }

    .cell.tg {
      outline: 3px dashed var(--r)
    }

    .cell.hi {
      outline: 4px solid var(--g);
      background-color: #ffd77a55
    }

    .cell.sel {
      outline: 4px solid #fff
    }

    .s {
      width: 1.6vh;
      height: 1.6vh;
      border-radius: 50%;
      box-shadow: inset -1px -2px 3px #0008
    }

    .n {
      position: absolute;
      right: 5%;
      bottom: 3%;
      font-weight: 800;
      font-size: 2.2vh;
      background: #000b;
      border-radius: 8px;
      padding: 0 .4em
    }

    .Q {
      width: 6.5vh;
      height: 6.5vh;
      border-radius: 50%;
      background: radial-gradient(#fff3b0, #e0982b);
      color: #5a2400;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 1.5vh;
      border: 3px solid #7a3b0c
    }

    .Q.rd {
      box-shadow: 0 0 14px 5px var(--r)
    }

    .tr {
      position: absolute;
      left: 4%;
      top: 3%;
      font-size: 2.8vh;
      filter: drop-shadow(0 0 4px #f00)
    }

    #act {
      display: flex;
      gap: 1vw;
      justify-content: center;
      min-height: 5vh
    }

    #hand {
      height: 18vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 1vw;
      position: relative;
      z-index: 5
    }

    .dk {
      position: absolute;
      left: 0;
      bottom: 0;
      color: var(--g);
      font-weight: 700
    }

    .card {
      --w: clamp(88px, 12vh, 140px);
      width: var(--w);
      height: calc(var(--w)*1.45);
      font-size: calc(var(--w)/10.5);
      flex: 0 0 auto;
      border-radius: 1em;
      padding: .6em .5em;
      text-align: center;
      color: #2a1405;
      background: linear-gradient(#fff2cf, #e9c27a);
      border: .28em solid var(--c);
      box-shadow: 0 .4em 1em #000a, inset 0 0 0 .15em #fff8;
      transition: transform .18s;
      transform-origin: 50% 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .2em;
      cursor: pointer
    }

    .card.S {
      --c: #0fae9b
    }

    .card.T {
      --c: #d63a1f
    }

    .card i {
      font-style: normal;
      font-size: .7em;
      font-weight: 800;
      letter-spacing: .1em;
      color: #fff;
      background: var(--c);
      border-radius: 1em;
      padding: .1em .7em
    }

    .card .ic {
      font-size: 2.4em;
      line-height: 1.1
    }

    .card p {
      font-size: .82em;
      line-height: 1.25
    }

    .card:hover {
      transform: translateY(-6%) scale(1.75);
      z-index: 40
    }

    .card.off {
      filter: grayscale(.85) brightness(.75)
    }

    #ov {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000b;
      z-index: 60;
      padding: 2vh
    }

    #ov.on {
      display: flex
    }

    #ov.solid {
      background: #120d0c
    }

    .modal {
      background: linear-gradient(#2a1410, #150a08);
      border: 3px solid var(--g);
      border-radius: 18px;
      padding: 3vh 3vw;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.4vh;
      align-items: center;
      max-width: 94vw;
      box-shadow: 0 0 50px #e8472b99
    }

    .row {
      display: flex;
      gap: 1.2vw;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center
    }

    .big {
      font-size: min(6vh, 44px)
    }

    .help .card {
      --w: 110px;
      margin: 6px
    }

    .av {
      width: min(24vh, 22vw);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 4px solid var(--g);
      object-fit: cover;
      box-shadow: 0 0 30px var(--r)
    }

    #fl {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3vh;
      background: #0007;
      z-index: 80;
      pointer-events: none
    }

    #fl.on {
      display: flex
    }

    #fl .card {
      --w: 190px;
      transform: none
    }

    @media(max-aspect-ratio:1/1) {
      #game {
        padding: 7vh 2vw 3vh
      }

      .card {
        --w: clamp(56px, 15vw, 110px)
      }

      #hand {
        gap: .5vw
      }
    }
  </style>
</head>

        const n2 = (nx + dir + 12) % 12, oq = own(n2), gd = S.d[n2]; let qq = 0, ok = true;
        if (S.q[n2]) { if (oq != p && !S.P[oq].shield && gd >= QMIN) qq = 1; else ok = false }
        if (ok && (gd || qq)) { const gain = gd + 10 * qq, x2 = S.dbl; S.d[n2] = 0; P.bank += gd; if (qq) { S.q[n2] = 0; P.qc++ } if (x2) { P.bonus += gain; S.dbl = false } fr(S, F, n2, `😋 Ăn ${gd} quân dân${qq ? ' + 1 QUAN (+10)' : ''}${x2 ? ' ✨ nhân đôi điểm!' : ''}`) }
        break
      }
    }
    function chk(S, p, id) { if (S.blk) return '🔒 Bị Phong Ấn: lượt này không được dùng thẻ.'; if (S.used) return 'Mỗi lượt chỉ được dùng tối đa 1 thẻ.'; if (!S.P[p].hand.includes(id)) return 'Bạn không có thẻ này.'; return '' }
    function spell(S, p, id) {
      if (!CARDS[id] || CARDS[id].t != 'S') return 'Thẻ không hợp lệ.'; const e = chk(S, p, id); if (e) return e; const P = S.P[p];
      if (id == 'nghichluu') S.rev = true; else if (id == 'nhanboi') S.dbl = true;
      else if (id == 'anphong') { if (!S.q[OWNQ[p]]) return 'Quan của bạn đã bị ăn, thẻ này không còn tác dụng.'; P.shield = true }
      else { const r = cells(1 - p).sort((a, b) => S.d[b] - S.d[a])[0], k = Math.min(2, S.d[r]); if (!k) return 'Đối thủ không có quân dân để hút.'; S.d[r] -= k; P.bank += k }
      P.hand.splice(P.hand.indexOf(id), 1); P.dis.push(id); S.used = true; return ''
    }
    function placeTrap(S, p, id, i) {
      if (!CARDS[id] || CARDS[id].t != 'T') return 'Thẻ không hợp lệ.'; const e = chk(S, p, id); if (e) return e; if (S.t[i]) return 'Ô này đã có bẫy.'; if (S.t.some(x => x && x.o == p)) return 'Mỗi người chỉ có tối đa 1 bẫy đang hoạt động.';
      S.t[i] = { o: p, id }; const P = S.P[p]; P.hand.splice(P.hand.indexOf(id), 1); S.used = true; return ''
    }
    const mv = (S, p) => { const r = []; for (const c of legal(S, p)) for (const d of [1, -1]) r.push([c, d]); return r };
    function simv(S, p, c, d, fl) {
      const C = clone(S); Object.assign(C, fl || {}); const tp = C.t.map(x => x && x.o != p); C.t = C.t.map(() => null); run(C, p, c, d, null); const o = 1 - p, side = q => cells(q).reduce((a, i) => a + C.d[i], 0);
      let v = sc(C.P[p]) - sc(C.P[o]) + .5 * (side(p) - side(o)) - 3 * C.ends.filter(e => tp[e]).length; if (S.DEF) v += 3 * C.q[OWNQ[p]]; return v + Math.random() * .01
    }
    function best(S, p, fl) { let b = null; for (const [c, d] of mv(S, p)) { const v = simv(S, p, c, d, fl); if (!b || v > b.v) b = { c, d, v } } return b }
    function threat(S, p) { const o = 1 - p; return mv(S, o).some(([c, d]) => { const C = clone(S); C.t = C.t.map(() => null); run(C, o, c, d, null); return C.P[o].qc > S.P[o].qc }) }
    function aiPick(S, p) {
      if (S.used || S.blk) return null; const P = S.P[p], o = 1 - p, h = k => P.hand.includes(k), b0 = best(S, p).v;
      if (h('nhanboi') && best(S, p, { dbl: true }).v > b0 + 4) return { id: 'nhanboi' };
      if (h('nghichluu') && best(S, p, { rev: true }).v > b0 + 3) return { id: 'nghichluu' };
      if (h('anphong') && S.q[OWNQ[p]] && threat(S, p)) return { id: 'anphong' };
      if (h('hutquan') && Math.max(...cells(o).map(i => S.d[i])) >= 4) return { id: 'hutquan' };
      const tk = ['doat', 'catmach', 'nghichhanh', 'phongan'].find(h);
      if (tk && !S.t.some(x => x && x.o == p)) {
        const f = {}; for (const [c, d] of mv(S, o)) { const C = clone(S); C.t = C.t.map(() => null); run(C, o, c, d, null); const e = C.ends[0]; f[e] = (f[e] || 0) + 1 }
        const cs = [...Array(12).keys()].filter(i => !S.t[i]).sort((a, b) => (f[b] || 0) - (f[a] || 0)); if (cs.length && f[cs[0]]) return { id: tk, cell: cs[0] }
      }
      return null
    }
    //ENGINE_END
    let S, cfg, gen = 0, paused = false, inp = false, mode = null, pend = null, sel = null, V = 0, name = 'Khách', snd = true, AC, AVs = [];
    try { name = localStorage.getItem('oaq_name') || 'Khách' } catch (e) { }
    const msg = t => { $('#mid').textContent = t };
    const sleep = async ms => { const g = gen; await new Promise(r => setTimeout(r, ms)); while (paused && g == gen) await new Promise(r => setTimeout(r, 120)); if (g != gen) throw 0 };
    const sf = p => p.catch(e => { if (e !== 0) { console.error(e); msg('⚠️ Lỗi: ' + (e && e.message)) } });
    const beep = (f, d = .08) => { if (!snd) return; try { AC = AC || new AudioContext(); const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.value = .05; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d) } catch (e) { } };
    const card = (id, c = '') => { const k = CARDS[id]; return `<div class="card ${k.t} ${c}" data-id="${id}"><i>${k.t == 'S' ? 'BÙA CHÚ' : 'BÀI BẪY'}</i><div class=ic>${k.i}</div><b>${k.n}</b><p>${k.d}</p></div>` };
    const show = id => document.querySelectorAll('.scr').forEach(e => e.classList.toggle('on', e.id == id));
    function modal(h, solid) { const o = $('#ov'); o.classList.toggle('solid', !!solid); if (h == null) o.classList.remove('on'); else { o.innerHTML = `<div class=modal>${h}</div>`; o.classList.add('on') } }
    const greet = () => { $('#hello').textContent = 'Xin chào, ' + name + '!' };
    function guest() { name = 'Khách'; greet(); show('menu') }
    function login() { modal(`<h2>Đăng nhập</h2><p>Nhập tên của bạn (chỉ lưu trên máy này)</p><input id=nm maxlength=14 value="${name == 'Khách' ? '' : name}"><div class=row><button onclick="saveName()">Vào game</button><button class=d onclick="modal()">Hủy</button></div>`) }
    function saveName() { name = $('#nm').value.trim().replace(/[<>&"]/g, '') || 'Khách'; try { localStorage.setItem('oaq_name', name) } catch (e) { } modal(); greet(); show('menu') }
    function tglSnd(b) { snd = !snd; b.textContent = '🔊 Âm thanh: ' + (snd ? 'Bật' : 'Tắt') }
    function help() { modal(`<h2>Cách chơi</h2><p style="max-width:72ch;text-align:left;line-height:1.55">• Chọn ô dân phía bạn (có quân) rồi chọn hướng rải. Sau quân cuối: ô kế tiếp có quân → bốc rải tiếp; ô kế tiếp trống mà ô sau có quân/quan → ăn và hết lượt.<br>• Quan = 10 điểm, chỉ ăn được khi ô quan đã có ≥ 3 quân dân (quan sáng viền đỏ là đang bị đe dọa). Mỗi quân dân = 1 điểm. Hết quân ở 5 ô của mình: tự gieo lại bằng 5 quân đã ăn.<br>• Mỗi lượt dùng tối đa 1 thẻ: Bùa Chú (dùng ngay) hoặc Bài Bẫy (úp lên 1 ô, chỉ nổ khi quân cuối của đối thủ rơi vào đó).<br>• Trận kết thúc khi cả 2 quan bị ăn, hết nước đi hoặc sau 40 lượt. <b>Rê chuột vào thẻ để phóng to và đọc chức năng.</b></p><div class="row help">${Object.keys(CARDS).map(k => card(k)).join('')}</div><button onclick="modal()">Đã hiểu</button>`) }
    function start(m, b) {
      cfg = { m, b }; gen++; paused = false; inp = false; mode = sel = null;
      const n = m == 'boss' ? [name, b ? 'Quan Huyện' : 'Phú Ông'] : ['Người chơi 1', 'Người chơi 2'];
      S = newState(n); S.hot = m != 'boss'; S.DEF = !!b; AVs = [AV.tq, b && m == 'boss' ? AV.qh : AV.po]; V = 0;
      $('#hand').innerHTML = ''; $('#act').innerHTML = ''; msg(''); show('game'); render();
      modal(`<div class=row><img class=av src="${AVs[0]}"><h2 class=big>VS</h2><img class=av src="${AVs[1]}"></div><h2>${n[0]} ⚔ ${n[1]}</h2>`);
      sf((async () => { await sleep(2000); modal(); await turn() })())
    }
    const cover = p => new Promise(res => { modal(`<h2>🔄 Chuyển thiết bị</h2><p>Đưa máy cho <b>${S.P[p].n}</b>.<br>Bài trên tay và thông tin riêng của người vừa chơi đang được che.</p><button id=cb>Bắt đầu lượt</button>`, 1); $('#cb').onclick = () => { modal(); res() } });
    async function turn() {
      const p = S.cur, P = S.P[p]; if (over(S)) return fin_();
      P.shield = false; S.blk = P.seal; P.seal = false; S.used = false; S.dbl = false; S.rev = false; mode = sel = null; inp = false; $('#act').innerHTML = '';
      if (P.draw.length) P.hand.push(P.draw.shift());
      if (!legal(S, p).length) { if (P.bank >= 5) { P.bank -= 5; cells(p).forEach(i => S.d[i]++); msg(`♻️ ${P.n} gieo lại 5 quân dân!`); beep(400) } else { msg(`⏭ ${P.n} hết nước đi, bỏ lượt.`); render(); await sleep(1300); return next() } }
      if (S.hot) { $('#hand').innerHTML = ''; await cover(p) }
      V = S.hot ? p : 0; render(); hand();
      if (!S.hot && p == 1) return aiTurn();
      inp = true; hand(); msg(`Lượt của ${P.n}. ${P.flip ? '⚠️ Hướng rải sẽ bị đảo! ' : ''}${S.blk ? '🔒 Đang bị Phong Ấn, không dùng được thẻ. ' : ''}Chọn một thẻ hoặc chọn ô dân của bạn để rải quân.`)
    }
    const next = () => { S.turn++; S.cur = 1 - S.cur; return turn() };
    function hud(s) { [0, 1].forEach(i => { const P = S.P[i], e = $('#c' + i); e.className = 'chip' + (S.cur == i ? ' me' : ''); e.innerHTML = `<img src="${AVs[i]}"><div><b>${P.n}</b>Điểm: <strong>${s[i]}</strong><br><small>Kho ${P.bank} • Quan ${P.qc} • Bài ${P.hand.length}</small></div>` }) }
    function render(f) {
      const B = f || S; hud(f ? f.s : [sc(S.P[0]), sc(S.P[1])]);
      $('#board').innerHTML = [...Array(12).keys()].map(i => {
        const q = i % 6 == 0, T = B.t[i], c = q ? (i ? 7 : 1) : (i < 6 ? i + 1 : 13 - i), r = q ? '1/3' : i < 6 ? 2 : 1; let cl = 'cell' + (q ? ' qc' : '');
        if (f && f.h == i) cl += ' hi'; if (sel == i) cl += ' sel'; if (inp && mode == null && own(i) == S.cur && !q && B.d[i]) cl += ' ok'; if (mode == 'trap' && !T) cl += ' tg';
        let h = B.q[i] ? `<div class="Q${B.d[i] >= QMIN ? ' rd' : ''}">QUAN</div>` : ''; h += Array.from({ length: Math.min(B.d[i], 18) }, (_, k) => `<span class=s style="background:${COL[(i + k) % 5]}"></span>`).join('');
        h += `<span class=n>${B.d[i]}</span>`; if (T) h += `<span class=tr>${T.o == V ? CARDS[T.id].i : '🕸️'}</span>`;
        return `<div class="${cl}" data-i=${i} style="grid-column:${c};grid-row:${r}">${h}</div>`
      }).join('')
    }
    function hand() { const P = S.P[V], off = !inp || S.blk || S.used; $('#hand').innerHTML = P.hand.map(k => card(k, off ? 'off' : '')).join('') + `<small class=dk>Bộ bài còn ${P.draw.length} lá</small>` }
    function cardClick(id) {
      if (!inp) return; const p = S.cur, k = CARDS[id];
      if (k.t == 'S') { const e = spell(S, p, id); if (e) return msg(e); hand(); render(); sf(flash(id, `${S.P[p].n} dùng ${k.n}!`)); msg(`✨ Đã dùng ${k.n}. Giờ hãy chọn ô để rải quân.`) }
      else { const e = chk(S, p, id) || (S.t.some(x => x && x.o == p) ? 'Mỗi người chỉ có tối đa 1 bẫy đang hoạt động.' : ''); if (e) return msg(e); mode = 'trap'; pend = id; sel = null; render(); msg(`🕸️ Chọn một ô bất kỳ để úp ${k.n}.`); $('#act').innerHTML = '<button class=d onclick="cancel()">Hủy đặt bẫy</button>' }
    }
    function cellClick(i) {
      if (!inp) return; const p = S.cur;
      if (mode == 'trap') { const e = placeTrap(S, p, pend, i); if (e) return msg(e); mode = null; $('#act').innerHTML = ''; beep(260); hand(); render(); return msg('🕸️ Đã úp bẫy xuống ô. Giờ hãy chọn ô để rải quân.') }
      if (own(i) != p || i % 6 == 0) return msg('❌ Hãy chọn một ô dân thuộc phía của bạn.');
      if (!S.d[i]) return msg('❌ Ô trống, không thể rải quân.');
      sel = i; render(); msg(`Ô này có ${S.d[i]} quân. Chọn hướng rải.`);
      $('#act').innerHTML = '<button onclick="go(-1)">⬅ Rải sang trái</button><button onclick="go(1)">Rải sang phải ➡</button><button class=d onclick="cancel()">Hủy</button>'
    }
    const go = sd => sf(move(sel, sel < 6 ? sd : -sd)), cancel = () => { mode = sel = null; $('#act').innerHTML = ''; render() };
    async function move(c, d) { inp = false; mode = sel = null; $('#act').innerHTML = ''; hand(); const F = []; run(S, S.cur, c, d, F); await play(F); return next() }
    async function play(F) { for (const f of F) { render(f); if (f.m) msg(f.m); beep(f.m ? 560 : 330 + f.h * 18); await sleep(f.m ? 750 : 240) } render() }
    async function flash(id, t) { const f = $('#fl'); f.innerHTML = card(id) + `<h2>${t}</h2>`; f.classList.add('on'); beep(700, .2); try { await sleep(1500) } finally { f.classList.remove('on') } }
    async function aiTurn() {
      const p = S.cur, P = S.P[p]; msg(`${P.n} đang suy nghĩ…`); await sleep(1000); const k = aiPick(S, p);
      if (k) {
        const t = CARDS[k.id]; if (k.cell != null) placeTrap(S, p, k.id, k.cell); else spell(S, p, k.id);
        if (t.t == 'S') await flash(k.id, `${P.n} dùng ${t.n}!`); else { beep(260); msg(`🕸️ ${P.n} úp một Bài Bẫy xuống bàn cờ!`); render(); await sleep(1400) } render()
      }
      const b = best(S, p); return move(b.c, b.d)
    }
    function fin_() {
      inp = false; render(); const f = final(S), a = S.P[0], b = S.P[1], w = f[0] > f[1] ? 0 : f[1] > f[0] ? 1 : -1;
      const t = w < 0 ? '🤝 HÒA' : S.hot ? `🏆 ${S.P[w].n} THẮNG` : w == 0 ? '🏆 CHIẾN THẮNG' : '💀 THẤT BẠI'; beep(w == 0 ? 880 : 200, .4);
      modal(`<h2 class=big>${t}</h2><p style="font-size:1.3em"><b>${a.n}</b>: ${f[0]} điểm &nbsp;|&nbsp; <b>${b.n}</b>: ${f[1]} điểm</p><p>Quan đã ăn: ${a.qc} – ${b.qc} • Bẫy kích hoạt: ${S.trig} • Số lượt: ${S.turn}</p><div class=row><button onclick="restart()">🔁 Chơi lại</button><button class=d onclick="quit()">🏠 Về menu</button></div>`)
    }
    function pause() { paused = true; modal(`<h2>⏸ Tạm dừng</h2><div class=row><button onclick="resume()">▶ Tiếp tục</button><button onclick="restart()">🔁 Chơi lại</button><button class=d onclick="quit()">🚪 Thoát về menu</button></div>`) }
    function askQuit() { paused = true; modal(`<h2>Thoát trận đấu?</h2><p>Tiến trình trận này sẽ không được lưu.</p><div class=row><button onclick="resume()">Ở lại</button><button class=d onclick="quit()">Thoát</button></div>`) }
    const resume = () => { paused = false; modal() }, restart = () => { modal(); start(cfg.m, cfg.b) }, quit = () => { gen++; paused = false; inp = false; modal(); show('menu') };
    $('#hand').onclick = e => { const c = e.target.closest('.card'); if (c) cardClick(c.dataset.id) };
    $('#board').onclick = e => { const c = e.target.closest('.cell'); if (c) cellClick(+c.dataset.i) };
    addEventListener('keydown', e => { if (e.key == 'Escape' && $('#game').classList.contains('on') && !$('#ov').classList.contains('on')) pause() });
    greet();
  </script>
</body>
